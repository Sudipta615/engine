[package]
name = "plugin-abi"
version = "5.8.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Sudipta615/engine"
description = "Shadow Desktop plugin ABI: versioned C-ABI vtables for pure-Rust effect plugins"

[features]
default = ["host"]
# Dynamic library loading for the host (dlopen / LoadLibrary). Pure-plugin
# builds (like the reference echo plugin) turn this off to stay tiny.
host = ["dep:libloading"]
# Serialize the descriptor/state types (save/restore travels as serde JSON).
serde-types = ["dep:serde"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
libloading = { version = "0.8", optional = true }
